name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version name
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists - nothing to release. Bump versionName to cut a new release." >&2
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.ver.outputs.exists == 'false'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "No KEYSTORE_BASE64 secret set - building UNSIGNED release APK." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release
        if: steps.ver.outputs.exists == 'false'
        env:
          RELEASE_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        if: steps.ver.outputs.exists == 'false'
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" "phantomauto-${{ steps.ver.outputs.tag }}.apk"

      - name: Upload workflow artifact
        if: steps.ver.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: phantomauto-release-apk
          path: phantomauto-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: phantomauto ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: phantomauto-*.apk
          body: |
            Automated build from `release` branch for `${{ steps.ver.outputs.tag }}`.

            Signing: ${{ steps.keystore.outputs.signed == 'true' && 'release keystore (upgradeable)' || '**UNSIGNED** - install via adb only' }}
